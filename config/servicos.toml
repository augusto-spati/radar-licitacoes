# Serviços-padrão da etapa 7b (spec 2026-11-27-etapa-07b-precos-design.md, "Serviços-padrão").
#
# Regras de casamento, todas sobre a descrição sem acento e em minúsculas (U+FFFD vale por
# qualquer letra; cada termo casa no começo de uma palavra, então "asfalt" casa "asfaltico"):
#   termos_obrigatorios: todos precisam aparecer; um item que é lista vale se qualquer um aparecer.
#   termos_qualquer:     pelo menos um precisa aparecer (lista vazia = sem exigência).
#   termos_excluidos:    nenhum pode aparecer.
#   unidades_aceitas:    unidade do item (sem acento, sem ponto nem espaço) -> fator.
#                        quantidade canônica = quantidade x fator; preço canônico = preço / fator.
# Serviço de rede (com `materiais`) exige material reconhecível, DN dentro de [dn_min, dn_max]
# e escopo claro (só o tubo, só o assentamento ou os dois); sem um deles o item fica sem serviço.
# Linha de rede que cita água e esgoto ("PARA REDE DE AGUA OU ESGOTO") também fica sem, assim
# como um item que casa com mais de um serviço.

# Pré-filtro dos processos do TCE-PE (`radar.precos.tcepe.processo_de_saneamento`): substring
# sobre o objeto, sem acento, sem palavras vazias e no singular. Os termos das linhas `redes` e
# `perdas` da 7a (config/filtro.toml) não pegam "SISTEMAS DE ESGOTAMENTO SANITÁRIO" (Compesa,
# GNR Sertão) nem "REDE COLETORAS DE ESGOTO" (Pedra). Medido nos 31.643 processos de 2026
# (listagem de 2026-11-27): termos da 7a → 14 processos (13 homologados, 5 da Compesa); esta
# lista → 170 (120 homologados, 19 da Compesa). Só itens com serviço-padrão são gravados, então
# o excesso custa requisições (≥ 2 por processo homologado), não linhas.
[processos]
termos = [
    "rede de agua", "rede de esgoto", "ligacao de agua", "ligacao de esgoto", "adutora",
    "assentamento de tubulacao", "vazamento", "perdas de agua", "setorizacao", "hidrometro",
    "macromedicao", "pitometria", "rede coletora", "esgotamento sanitario", "sistema de esgoto",
    "esgoto sanitario", "abastecimento de agua", "sistema de abastecimento", "ligacao predial",
    "saneamento",
]

[[servico]]
nome = "ligacao_agua"
rotulo = "Ligação predial de água"
linha = "redes"
unidade = "un"
termos_obrigatorios = ["agua"]
# 7b.2: planilhas do PNCP dizem "Ligação de água" sem "predial" (o "completa" não exclui).
termos_qualquer = [
    "ligacao predial", "ligacoes prediais", "ramal predial", "ramais prediais",
    "ligacao domiciliar", "ligacoes domiciliares", "ramal domiciliar", "ramais domiciliares",
    "ligacao de agua", "ligacoes de agua",
]
# Conserto e manutenção de ramal existente não são ligação nova (TCE-PE: "CONSERTO DE RAMAIS
# PREDIAIS DE ÁGUA DANIFICADOS DURANTE EXECUÇÃO DAS OBRAS").
termos_excluidos = [
    "esgoto", "supress", "corte", "religa", "remanej", "desativ", "retirada", "cadastr",
    "vistoria", "projeto", "conserto", "reparo", "manutenc", "substituicao de ramal",
    "substituicao de ramais",
]
[servico.unidades_aceitas]
un = "1"
und = "1"
unid = "1"
unidade = "1"
ud = "1"
lig = "1"
ligacao = "1"

[[servico]]
nome = "ligacao_esgoto"
rotulo = "Ligação predial de esgoto"
linha = "redes"
unidade = "un"
termos_obrigatorios = ["esgoto"]
termos_qualquer = [
    "ligacao predial", "ligacoes prediais", "ramal predial", "ramais prediais",
    "ligacao domiciliar", "ligacoes domiciliares", "ramal domiciliar", "ramais domiciliares",
    "ligacao de esgoto", "ligacoes de esgoto",
]
termos_excluidos = [
    "supress", "corte", "remanej", "desativ", "retirada", "cadastr", "vistoria", "projeto",
    "conserto", "reparo", "manutenc", "substituicao de ramal", "substituicao de ramais",
]
[servico.unidades_aceitas]
un = "1"
und = "1"
unid = "1"
unidade = "1"
ud = "1"
lig = "1"
ligacao = "1"

[[servico]]
nome = "hidrometro"
rotulo = "Hidrômetro, fornecimento e instalação"
linha = "perdas"
unidade = "un"
termos_obrigatorios = ["hidrometro"]
termos_qualquer = ["fornecimento", "instalacao", "substituicao", "troca"]
# Caixa, abrigo, lacre e cavalete são outros itens; leitura e aferição são outros serviços.
termos_excluidos = [
    "leitura", "caixa", "abrigo", "lacre", "cavalete", "aferi", "ligac", "ramal", "macromed",
    "retirada",
]
[servico.unidades_aceitas]
un = "1"
und = "1"
unid = "1"
unidade = "1"
ud = "1"
pc = "1"
peca = "1"

[[servico]]
nome = "pesquisa_vazamento"
rotulo = "Pesquisa de vazamento não visível"
linha = "perdas"
unidade = "km"
termos_obrigatorios = ["vazamento"]
termos_qualquer = ["pesquisa", "deteccao", "geofonamento", "varredura"]
termos_excluidos = ["reparo", "conserto"]
[servico.unidades_aceitas]
km = "1"
m = "0.001"
ml = "0.001"
metro = "0.001"
metros = "0.001"

[[servico]]
nome = "escavacao_vala"
rotulo = "Escavação mecânica de vala"
linha = "redes"
unidade = "m3"
termos_obrigatorios = ["escavacao", "vala"]
termos_qualquer = []
# Manual e em rocha custam várias vezes a mecânica em solo; carga, manobra e transporte do
# material escavado são outro item. Linha que junta escavação com reaterro/compactação
# ("Escavação mecânica, reaterro e compactação vala") tem outro preço por m³.
termos_excluidos = [
    "manual", "rocha", "3a categoria", "terceira categoria", "transporte", "carga", "descarga",
    "manobra", "remanej", "bota-fora", "bota fora", "empolamento", "reaterro", "aterro",
    "compactac",
]
# A faixa de profundidade (até 1,5 m; 1,5 a 3 m; 3 a 6 m) faz parte da chave; sem ela, fica sem.
exige_faixa = true
[servico.unidades_aceitas]
m3 = "1"
metrocubico = "1"
metroscubicos = "1"

[[servico]]
nome = "recomposicao_asfalto"
rotulo = "Recomposição de pavimento asfáltico"
linha = "redes"
unidade = "m2"
termos_obrigatorios = [["asfalt", "cbuq"]]
termos_qualquer = ["recomposicao", "reposicao", "repavimentacao", "recompor"]
termos_excluidos = ["transporte", "imprimacao", "pintura", "fresagem", "demolicao", "corte"]
[servico.unidades_aceitas]
m2 = "1"
metroquadrado = "1"
metrosquadrados = "1"

[[servico]]
nome = "rede_agua"
rotulo = "Rede de água"
linha = "redes"
unidade = "m"
termos_obrigatorios = ["agua"]
termos_qualquer = ["rede", "redes", "tubo", "tubos", "tubula", "assentamento"]
# Conexões, peças e serviços auxiliares citam "rede de água" mas não são o metro de rede.
termos_excluidos = [
    "esgoto", "pluvia", "drenag", "predia", "ligac", "ramal", "escavac", "reaterro", "aterro",
    "pavimento", "escoramento", "berco", "lastro", "envelop", "sinaliz", "teste", "ensaio",
    "cadastr", "limpeza", "desinfec", "lavagem", "demolic", "retirada", "remoc", "projeto",
    "sondagem", "curva", "joelho", "luva", "registro", "valvula", "conexao", "conexoes",
    "adaptador", "reducao", "juncao", "flange", "tampao", "colar", "hidrante", "ventosa",
    "vazamento", "pesquisa", "reparo", "conserto", "manutenc",
    # Logística e remanejamento: o preço não é o do metro de rede nova.
    "transporte", "carga", "descarga", "manobra", "remanej", "deslocamento", "armazen",
    "estocagem",
    # 7b.2: método não destrutivo tem outro preço por metro (spike: "PERFURAÇÃO HORIZONTAL
    # DIRECIONAL E INSTALAÇÃO DE TUBULAÇÃO PEAD 500 MM" casava como assentamento).
    "direcional", "nao destrutivo", "mnd", "pipe bursting",
]
dn_min = 50
dn_max = 600
[servico.unidades_aceitas]
m = "1"
ml = "1"
mt = "1"
metro = "1"
metros = "1"
km = "1000"
[[servico.materiais]]
nome = "pvc"
termos = ["pvc", "defofo"]
[[servico.materiais]]
nome = "pead"
termos = ["pead", "polietileno"]
[[servico.materiais]]
nome = "fofo"
termos = ["fofo", "ferro fundido", "ferro ductil"]

[[servico]]
nome = "rede_esgoto"
rotulo = "Rede de esgoto"
linha = "redes"
unidade = "m"
termos_obrigatorios = ["esgoto"]
termos_qualquer = ["rede", "redes", "coletor", "tubo", "tubos", "tubula", "manilha", "assentamento"]
termos_excluidos = [
    "pluvia", "drenag", "predia", "ligac", "ramal", "escavac", "reaterro", "aterro",
    "pavimento", "escoramento", "berco", "lastro", "envelop", "sinaliz", "teste", "ensaio",
    "cadastr", "limpeza", "desobstru", "inspec", "demolic", "retirada", "remoc", "projeto",
    "sondagem", "curva", "joelho", "luva", "registro", "valvula", "conexao", "conexoes",
    "adaptador", "reducao", "juncao", "flange", "tampao", "poco", "caixa", "reparo",
    "conserto", "manutenc", "vazamento",
    # Logística e remanejamento: o preço não é o do metro de rede nova.
    "transporte", "carga", "descarga", "manobra", "remanej", "deslocamento", "armazen",
    "estocagem",
    # 7b.2: método não destrutivo tem outro preço por metro (spike: "PERFURAÇÃO HORIZONTAL
    # DIRECIONAL E INSTALAÇÃO DE TUBULAÇÃO PEAD 500 MM" casava como assentamento).
    "direcional", "nao destrutivo", "mnd", "pipe bursting",
]
