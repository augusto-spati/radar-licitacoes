# Extração de exigências com LLM (etapa 6). Só modelos on-demand in-region de us-east-2:
# ids de foundation model, nunca perfis de inferência (us., global., eu., apac.).
#
# Sonda de 2026-11-26 (uma chamada Converse por modelo e modo, ~US$ 0,001 no total):
# - amazon.nova-lite-v1:0: recusa outputConfig ("This model doesn't support the outputConfig
#   field"); com ferramenta única e toolChoice forçado devolve toolUse.input válido.
# - openai.gpt-oss-120b-1:0: aceita outputConfig, mas o texto veio com lixo antes do JSON
#   ("**Ach{..."); com ferramenta, toolUse.input válido, precedido de um bloco reasoningContent.
# - qwen.qwen3-32b-v1:0: outputConfig funciona (JSON válido com "numero": null).
# - mistral.ministral-3-14b-instruct: outputConfig funciona (JSON válido; o trecho veio com
#   negrito em markdown, que a ancoragem descarta).
# No modo ferramenta, gpt-oss, qwen e ministral omitiram "numero" quando nulo (o esquema da
# ferramenta não é imposto); o Achado aceita a ausência como null.
#
# Preços on-demand (Standard) de us-east-2 conferidos na AWS Price List API (AmazonBedrock,
# regionCode us-east-2) em 2026-11-26, em US$ por milhão de tokens.

regiao = "us-east-2"
modelo_padrao = "amazon.nova-lite-v1:0"
teto_mensal_usd = 2.0
max_editais_por_rodada = 10
caracteres_por_trecho = 60000
max_trechos = 15
max_tokens = 4096

[modelos."amazon.nova-lite-v1:0"]
modo_saida = "ferramenta"
entrada_usd_mtok = 0.06
saida_usd_mtok = 0.24

[modelos."openai.gpt-oss-120b-1:0"]
modo_saida = "ferramenta"
entrada_usd_mtok = 0.15
saida_usd_mtok = 0.60

[modelos."qwen.qwen3-32b-v1:0"]
modo_saida = "json_schema"
entrada_usd_mtok = 0.15
saida_usd_mtok = 0.60

[modelos."mistral.ministral-3-14b-instruct"]
modo_saida = "json_schema"
entrada_usd_mtok = 0.20
saida_usd_mtok = 0.20

# Etapa 7b.2: planilhas orçamentárias dos editais do PNCP (radar planilhas atualizar).
# A IA só entra quando a leitura determinística acha menos de `minimo_linhas` linhas; os tetos
# próprios cabem no teto mensal acima (estimativa do pior caso antes de cada chamada). Spike de
# 2026-11-27: ~4 planilhas por IA por mês, ~US$ 0,001 cada (Nova Lite, só as páginas com R$).
[planilhas]
teto_edital_usd = 0.02
teto_mensal_usd = 0.30
max_editais_por_rodada = 10
# Editais publicados nos últimos N dias, do mais antigo ao mais novo.
janela_dias = 120
minimo_linhas = 5
minimo_rs_por_pagina = 8
max_caracteres = 60000
# Nova Lite: ~80 tokens por linha extraída; 5.000 cobrem ~60 linhas.
max_tokens = 5000
# Download desta etapa (o ZIP de Santa Bárbara d'Oeste tinha 25,6 MB; a análise usa 20 MB).
limite_download_bytes = 40000000
# Downloads por edital (título de planilha, "outros documentos", ZIPs, edital e TR).
max_downloads = 6
